<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bayyinah — Islamic Arabic & Qur'an Learning Platform</title>
  
  <!-- Google Fonts: Inter, Amiri (Arabic), and Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS compiled CDN or local reference setup -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            emerald: {
              50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669',
              700: '#047857', 800: '#065f46', 900: '#064e3b', 950: '#022c22',
            },
            gold: {
              400: '#d4af37', 500: '#b89228', 600: '#96731e',
            },
            surface: {
              light: '#fdfbf7',
              dark: '#0f1712',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            arabic: ['Amiri', 'serif'],
            display: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0f1712;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }
    .arabic-text {
      font-family: 'Amiri', serif;
      direction: rtl;
    }
    .glass-panel {
      background: rgba(15, 23, 18, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(16, 185, 129, 0.15);
    }
  </style>
</head>
<body class="selection:bg-emerald-500 selection:text-white">

  <!-- Application Root Mount Container -->
  <div id="root">
    <!-- Initial Loading Shell / Fallback State -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f1712; color: #fff; text-align: center; padding: 20px;">
      <div style="width: 64px; height: 64px; background-color: #059669; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: 'Amiri', serif; font-size: 32px; margin-bottom: 20px; box-shadow: 0 10px 30px -5px rgba(16, 185, 129, 0.3);">
        ق
      </div>
      <h1 style="font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 600; margin-bottom: 8px;">Bayyinah Platform</h1>
      <p style="font-size: 14px; color: #94a3b8; max-width: 320px;">Loading your calm, immersive Arabic and Qur'an learning environment...</p>
    </div>
  </div>

</body>
</html>
